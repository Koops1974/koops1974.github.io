<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#3f7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3f7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="140" y="440" font-size="34" letter-spacing="10" fill="#8fb4ff" font-weight="600">DIGITAL SIGNAGE</text>
    <text x="140" y="580" font-size="104" font-weight="700" letter-spacing="-2">This screen is live.</text>
